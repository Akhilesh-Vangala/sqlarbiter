[project]
name = "verified-data-incident-resolution"
version = "0.2.0"
description = "Reproducible business-metric incidents and independent repair verification"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx==0.28.1", "fastapi==0.128.8", "uvicorn==0.39.0", "python-dotenv==1.2.4", "anthropic==1.12.0", "langgraph==1.2.14", "langgraph-checkpoint-sqlite==3.1.1", "langgraph-checkpoint-postgres==3.1.3", "psycopg[binary,pool]==3.3.6", "pydantic==2.13.5", "duckdb==1.5.6", "sqlglot==30.21.0", "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"]

[tool.ruff]
line-length = 100

[project.optional-dependencies]
web = ["fastapi==0.128.8", "uvicorn==0.39.0", "python-dotenv==1.2.4"]
ai = ["anthropic==1.12.0"]
agent = ["langgraph==1.2.14", "langgraph-checkpoint-sqlite==3.1.1", "langgraph-checkpoint-postgres==3.1.3", "psycopg[binary,pool]==3.3.6", "pydantic==2.13.5"]
analytics = ["duckdb==1.5.6", "sqlglot==30.21.0"]
tracing = ["opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"]
test = ["httpx==0.28.1"]

[tool.vercel]
entrypoint = "app:app"
