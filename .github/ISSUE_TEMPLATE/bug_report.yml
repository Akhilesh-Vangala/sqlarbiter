name: Bug report
description: Report a reproducible engineering or application failure.
title: "[Bug]: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the workflow stage and whether the run used scripted or live model choices.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the source commit, runtime, commands and original synthetic fixture.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include sanitized errors or failing checks. Omit credentials, private data and customer documents.
