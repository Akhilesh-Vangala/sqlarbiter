name: Verify workbench
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: verifyops_test
          POSTGRES_USER: verifyops
          POSTGRES_PASSWORD: verifyops-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifyops -d verifyops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check src/vdir/web/app.js
      - run: node --check src/vdir/demo_assets/app.js
      - run: python scripts/public_demo_browser.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          VDIR_TEST_DATABASE_URL: postgresql://verifyops:verifyops-test-password@127.0.0.1:5432/verifyops_test
      - run: python tests/browser_smoke.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python tests/browser_graph_smoke.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python tests/browser_automation_smoke.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python tests/browser_pages_smoke.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python -m vdir.benchmark --output artifacts/generated/ci-benchmark --samples 1
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/generated/browser-smoke-*
            artifacts/generated/browser-graph-*
            artifacts/generated/browser-automation-*
            artifacts/generated/browser-pages-*
            artifacts/generated/ci-benchmark
            artifacts/generated/public-demo-browser
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t vdir:test .
      - run: docker run --name vdir-check vdir:test
      - run: docker cp vdir-check:/app/artifacts/generated artifacts/generated-container
        if: always()
      - run: docker build --target runtime -t vdir:check .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
      - name: Validate unapplied AWS infrastructure
        run: |
          terraform -chdir=deploy/terraform/aws fmt -check
          terraform -chdir=deploy/terraform/aws init -backend=false -input=false
          terraform -chdir=deploy/terraform/aws validate
      - name: Render Kubernetes bases and overlays
        run: |
          kubectl_version=v1.34.1
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          curl -fsSLo /tmp/kubectl.sha256 "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl kustomize deploy/k8s/base > /tmp/verifyops-base.yaml
          kubectl kustomize deploy/k8s/overlays/kind > /tmp/verifyops-kind.yaml
          kubectl kustomize deploy/k8s/overlays/aws > /tmp/verifyops-aws.yaml
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Kubernetes production-topology smoke
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          kind version
          kubectl version --client
          scripts/kind_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: artifacts/generated-container
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m venv .venv-dbt
      - run: .venv-dbt/bin/python -m pip install -r requirements-dbt.txt
      - run: python -m unittest discover -s tests -p test_dbt_integration.py -v
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
          VDIR_RUN_DBT_TESTS: "1"
      - run: python -m vdir.dbt_workflow --output artifacts/generated/ci-dbt
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python tests/browser_dbt_smoke.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-evidence
          path: |
            artifacts/generated/ci-dbt
            artifacts/generated/browser-dbt-*
