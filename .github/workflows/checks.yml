name: Verify workbench
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check src/vdir/web/app.js
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python tests/browser_smoke.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python tests/browser_graph_smoke.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python tests/browser_automation_smoke.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python tests/browser_pages_smoke.py
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - run: python -m vdir.benchmark --output artifacts/generated/ci-benchmark --samples 1
        env:
          PYTHONPATH: src
          VDIR_LOAD_DOTENV: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/generated/browser-smoke-*
            artifacts/generated/browser-graph-*
            artifacts/generated/browser-automation-*
            artifacts/generated/browser-pages-*
            artifacts/generated/ci-benchmark
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t vdir:test .
      - run: docker run --name vdir-check vdir:test
      - run: docker cp vdir-check:/app/artifacts/generated artifacts/generated-container
        if: always()
      - run: docker build --target runtime -t vdir:check .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: artifacts/generated-container
