name: SQLArbiter workbench
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sqlarbiter_test
          POSTGRES_USER: sqlarbiter
          POSTGRES_PASSWORD: sqlarbiter-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlarbiter -d sqlarbiter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r backend/requirements/development.txt
      - run: python -m playwright install --with-deps chromium
      - name: Lint and format check
        run: |
          pipx run ruff==0.14.0 check .
          pipx run ruff==0.14.0 format --check .
      - run: python scripts/checks/check_repository.py
      - run: node --check frontend/apps/workbench/assets/scripts/app.js
      - run: node --check frontend/apps/demo/assets/scripts/app.js
      - name: Parse product modules as ES modules
        run: |
          for file in $(find frontend/apps/product -name '*.js'); do
            node --input-type=module --check < "$file"
          done
      - name: Product browser and automated accessibility checks
        run: |
          npm install --prefix /tmp/product-a11y --no-audit --no-fund --save-exact axe-core@4.14.0
          python scripts/demos/product_browser.py --axe /tmp/product-a11y/node_modules/axe-core/axe.min.js
          python scripts/demos/import_browser.py --axe /tmp/product-a11y/node_modules/axe-core/axe.min.js
      - name: Account storage policies and concurrent quota checks
        run: python scripts/checks/product_rls.py
        env:
          SQLARBITER_PRODUCT_TEST_ADMIN_URL: postgresql://sqlarbiter:sqlarbiter-test-password@127.0.0.1:5432/sqlarbiter_test
      - run: python scripts/demos/uploads_browser.py
      - run: python scripts/demos/public_demo_browser.py
        env:
          PYTHONPATH: backend/src
          SQLARBITER_LOAD_DOTENV: "0"
      - run: python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend/src
          SQLARBITER_TEST_DATABASE_URL: postgresql://sqlarbiter:sqlarbiter-test-password@127.0.0.1:5432/sqlarbiter_test
      - run: python backend/tests/e2e/browser_smoke.py
        env:
          PYTHONPATH: backend/src
          SQLARBITER_LOAD_DOTENV: "0"
      - run: python backend/tests/e2e/browser_graph_smoke.py
        env:
          PYTHONPATH: backend/src
          SQLARBITER_LOAD_DOTENV: "0"
      - run: python backend/tests/e2e/browser_automation_smoke.py
        env:
          PYTHONPATH: backend/src
          SQLARBITER_LOAD_DOTENV: "0"
      - run: python backend/tests/e2e/browser_pages_smoke.py
        env:
          PYTHONPATH: backend/src
          SQLARBITER_LOAD_DOTENV: "0"
      - run: python -m sqlarbiter.evaluation.benchmark --output artifacts/generated/ci-benchmark --samples 1
        env:
          PYTHONPATH: backend/src
          SQLARBITER_LOAD_DOTENV: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/generated/browser-smoke-*
            artifacts/generated/browser-graph-*
            artifacts/generated/browser-automation-*
            artifacts/generated/browser-pages-*
            artifacts/generated/ci-benchmark
            artifacts/generated/public-demo-browser
            artifacts/generated/product-browser
  container:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/docker/Dockerfile --target test -t sqlarbiter:test .
      - run: docker run --name sqlarbiter-check sqlarbiter:test
      - run: |
          mkdir -p artifacts
          docker cp sqlarbiter-check:/app/artifacts/generated artifacts/generated-container
        if: always()
      - run: docker build -f backend/docker/Dockerfile --target runtime -t sqlarbiter:check .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
      - name: Validate AWS Terraform
        run: |
          terraform -chdir=infrastructure/terraform/aws fmt -check
          terraform -chdir=infrastructure/terraform/aws init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws validate
      - name: Render Kubernetes bases and overlays
        run: |
          kubectl_version=v1.34.1
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          curl -fsSLo /tmp/kubectl.sha256 "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl kustomize infrastructure/kubernetes/base > /tmp/sqlarbiter-base.yaml
          kubectl kustomize infrastructure/kubernetes/overlays/kind > /tmp/sqlarbiter-kind.yaml
          kubectl kustomize infrastructure/kubernetes/overlays/aws > /tmp/sqlarbiter-aws.yaml
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Kind deployment smoke
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          kind version
          kubectl version --client
          scripts/deployment/kind_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: artifacts/generated-container
  dbt:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements/development.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m venv .venv-dbt
      - run: .venv-dbt/bin/python -m pip install -r backend/requirements/dbt.txt
      - run: python -m unittest discover -s backend/tests -p test_dbt_integration.py -v
        env:
          PYTHONPATH: backend/src
          SQLARBITER_LOAD_DOTENV: "0"
          SQLARBITER_RUN_DBT_TESTS: "1"
      - run: python -m sqlarbiter.workflows.dbt_workflow --output artifacts/generated/ci-dbt
        env:
          PYTHONPATH: backend/src
          SQLARBITER_LOAD_DOTENV: "0"
      - run: python backend/tests/e2e/browser_dbt_smoke.py
        env:
          PYTHONPATH: backend/src
          SQLARBITER_LOAD_DOTENV: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-evidence
          path: |
            artifacts/generated/ci-dbt
            artifacts/generated/browser-dbt-*
