# Reproducible local production topology. PostgreSQL owns durable coordination;
# the shared state volume holds bounded execution workspaces and local evidence.
x-environment: &environment
  VDIR_ACCESS_TOKEN: ${VDIR_ACCESS_TOKEN:?Set a private operator access code of at least 32 characters}
  VDIR_OPERATOR_NAME: ${VDIR_OPERATOR_NAME:-operator}
  VDIR_PUBLIC_ORIGIN: ${VDIR_PUBLIC_ORIGIN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  VDIR_ANTHROPIC_MODEL: ${VDIR_ANTHROPIC_MODEL:-}
  VDIR_STATE_DIR: /state
  VDIR_DATABASE_URL: postgresql://verifyops:${VDIR_POSTGRES_PASSWORD:?Set VDIR_POSTGRES_PASSWORD}@postgres:5432/verifyops
  VDIR_CHECKPOINT_DATABASE_URL: postgresql://verifyops:${VDIR_POSTGRES_PASSWORD}@postgres:5432/verifyops
  VDIR_DATABASE_POOL_SIZE: ${VDIR_DATABASE_POOL_SIZE:-5}
  VDIR_RUN_BUDGET_USD: ${VDIR_RUN_BUDGET_USD:-1}
  VDIR_TOTAL_BUDGET_USD: ${VDIR_TOTAL_BUDGET_USD:-5}
  VDIR_SQL_ENGINE: ${VDIR_SQL_ENGINE:-duckdb}
  VDIR_OTLP_ENDPOINT: ${VDIR_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}

x-runtime: &runtime
  build:
    context: .
    dockerfile: backend/docker/Dockerfile
    target: runtime
  environment: *environment
  volumes:
    - state:/state
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: verifyops
      POSTGRES_USER: verifyops
      POSTGRES_PASSWORD: ${VDIR_POSTGRES_PASSWORD:?Set VDIR_POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifyops -d verifyops"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix@sha256:d240d8d4e364ee3483ed2de41ec12b760cc90bb0d4c6e2f190388772aba6fe1f
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - traces:/root/.phoenix
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    <<: *runtime
    command: ["python", "-m", "vdir.persistence.migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *runtime
    ports:
      - "127.0.0.1:${VDIR_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      phoenix:
        condition: service_started

  worker:
    <<: *runtime
    command: ["python", "-m", "vdir.workers.worker", "--state-dir", "/state"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      phoenix:
        condition: service_started
    healthcheck:
      disable: true

volumes:
  postgres:
  state:
  traces:
