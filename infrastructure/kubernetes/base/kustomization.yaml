apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: verifyops
resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccounts.yaml
  - state-pvc.yaml
  - migrate-job.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - api-pdb.yaml
  - worker-pdb.yaml
  - api-hpa.yaml
  - network-policies.yaml
labels:
  - pairs:
      app.kubernetes.io/name: verifyops
      app.kubernetes.io/part-of: verifyops
    includeSelectors: true
images:
  - name: verifyops
    newName: verifyops
    newTag: local
