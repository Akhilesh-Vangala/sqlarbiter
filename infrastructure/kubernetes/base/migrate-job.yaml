apiVersion: batch/v1
kind: Job
metadata:
  name: verifyops-migrate
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: verifyops-migrate
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: verifyops
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "vdir.persistence.migrations"]
          envFrom:
            - configMapRef:
                name: verifyops-config
            - secretRef:
                name: verifyops-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
