apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: verifyops
resources:
  - ../../base
  - postgres.yaml
secretGenerator:
  - name: verifyops-secrets
    literals:
      - VDIR_DATABASE_URL=postgresql://verifyops:kind-only-password@postgres:5432/verifyops
      - VDIR_CHECKPOINT_DATABASE_URL=postgresql://verifyops:kind-only-password@postgres:5432/verifyops
      - VDIR_ACCESS_TOKEN=kind-only-access-token-0000000000000000
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: verifyops
    newName: verifyops
    newTag: kind
patches:
  - path: kind-patch.yaml
