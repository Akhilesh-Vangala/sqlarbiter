apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sqlarbiter
resources:
  - ../../base
  - postgres.yaml
secretGenerator:
  - name: sqlarbiter-secrets
    literals:
      - SQLARBITER_DATABASE_URL=postgresql://sqlarbiter:kind-only-password@postgres:5432/sqlarbiter
      - SQLARBITER_CHECKPOINT_DATABASE_URL=postgresql://sqlarbiter:kind-only-password@postgres:5432/sqlarbiter
      - SQLARBITER_ACCESS_TOKEN=kind-only-access-token-0000000000000000
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: sqlarbiter
    newName: sqlarbiter
    newTag: kind
patches:
  - path: kind-patch.yaml
