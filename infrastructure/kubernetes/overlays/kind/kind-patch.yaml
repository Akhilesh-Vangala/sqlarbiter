apiVersion: v1
kind: ConfigMap
metadata:
  name: verifyops-config
data:
  VDIR_PUBLIC_ORIGIN: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verifyops-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifyops-api
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifyops-worker
spec:
  replicas: 2
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: verifyops-api
$patch: delete
