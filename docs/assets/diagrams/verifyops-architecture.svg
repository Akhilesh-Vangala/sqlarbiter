<text x="436" y="204" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#505050" font-weight="400" >SQLite WAL and atomic claims</text>
<text x="436" y="226" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#707070" font-weight="400" >Idempotency · leases · cancellation</text>
