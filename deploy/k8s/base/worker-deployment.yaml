apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifyops-worker
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: verifyops-worker
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-schema
          image: verifyops
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "vdir.wait_for_database"]
          envFrom:
            - configMapRef:
                name: verifyops-config
            - secretRef:
                name: verifyops-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: verifyops
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "vdir.worker", "--state-dir", "/state"]
          envFrom:
            - configMapRef:
                name: verifyops-config
            - secretRef:
                name: verifyops-secrets
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: verifyops-state
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
